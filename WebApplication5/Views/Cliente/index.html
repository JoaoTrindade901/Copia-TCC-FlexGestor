<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - FlexGestor</title>
    <link rel="stylesheet" href="/WebApplication5/wwwroot/css/homeCSS/home.css">
    <link rel="stylesheet" href="/WebApplication5/wwwroot/css/menuCSS/menu.css">
    <link rel="stylesheet" href="/WebApplication5/wwwroot/css/clienteCSS/cliente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <div id="menu"></div>

    <main>
        <section class="secao-clientes">

            <div class="cabecalho-tela">
                <h2>Gerenciamento de Clientes</h2>
                <button class="btn-novo-cliente" onclick="abrirModal()">
                    <i class="bi bi-person-plus-fill"></i> Novo Cliente
                </button>
            </div>

            <div class="table-container">
                <div class="area-filtro">
                    <select id="select-tipo-filtro" class="select-filtro" onchange="filtrarTabela()">
                        <option value="nome">Nome</option>
                        <option value="documento">CPF / CNPJ</option>
                    </select>
                    <input type="text" id="input-termo-busca" class="input-filtro"
                           placeholder="Filtrar..." oninput="filtrarTabela()">
                    <div class="filtro-status">
                        <button id="btn-filtro-todos"   class="btn-status-filtro" onclick="setFiltroStatus('todos')">Todos</button>
                        <button id="btn-filtro-ativo"   class="btn-status-filtro" onclick="setFiltroStatus('ativo')">Ativos</button>
                        <button id="btn-filtro-inativo" class="btn-status-filtro" onclick="setFiltroStatus('inativo')">Inativos</button>
                    </div>
                </div>

                <table class="table-clientes" id="tabela-clientes">
                    <thead>
                        <tr>
                            <th>Ações</th>
                            <th>Status</th>
                            <th>Tipo</th>
                            <th>Nome / Razão Social</th>
                            <th>CPF / CNPJ</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Saldo Dev.</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <div class="paginacao">
                    <span class="paginacao-info"></span>
                    <div class="paginacao-controles"></div>
                </div>
            </div>

        </section>
    </main>
</div>

<!-- ════════════════════════════════════════
     MODAL: NOVO CLIENTE
════════════════════════════════════════ -->
<div class="modal" id="modal-novo-cliente">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3><i class="bi bi-person-plus-fill"></i> Novo Cliente</h3>
            <button class="btn-fechar-modal" onclick="fecharModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="form-cliente">

                <!-- Toggle PF / PJ -->
                <div class="tipo-selector">
                    <span class="tipo-selector-label">Tipo de pessoa:</span>
                    <button type="button" class="tipo-btn tipo-btn-ativo" data-prefixo="novo" data-tipo="PF" onclick="alternarTipo('PF','novo')">
                        <i class="bi bi-person-fill"></i> Pessoa Física
                    </button>
                    <button type="button" class="tipo-btn" data-prefixo="novo" data-tipo="PJ" onclick="alternarTipo('PJ','novo')">
                        <i class="bi bi-building"></i> Pessoa Jurídica
                    </button>
                </div>

                <!-- Identificação -->
                <p class="form-secao">Identificação</p>
                <div class="form-grid">
                    <div class="form-group form-col-2">
                        <label>Nome Completo <span class="obrigatorio">*</span></label>
                        <input type="text" id="novo-nome" placeholder="Nome do cliente" required>
                    </div>
                    <div class="form-group">
                        <label id="novo-label-doc">CPF <span class="obrigatorio">*</span></label>
                        <input type="text" id="novo-doc" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group" id="novo-grupo-genero">
                        <label>Gênero</label>
                        <select id="novo-genero">
                            <option value="">Selecione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outro</option>
                        </select>
                    </div>
                    <div class="form-group" id="novo-grupo-nascimento">
                        <label>Data de Nascimento</label>
                        <input type="date" id="novo-nascimento">
                    </div>
                    <div class="form-group" id="novo-grupo-estadocivil">
                        <label>Estado Civil</label>
                        <select id="novo-estadocivil">
                            <option value="">Selecione</option>
                            <option value="Solteiro">Solteiro(a)</option>
                            <option value="Casado">Casado(a)</option>
                            <option value="Divorciado">Divorciado(a)</option>
                            <option value="Viúvo">Viúvo(a)</option>
                        </select>
                    </div>
                    <!-- Campos exclusivos PJ -->
                    <div class="form-group form-col-2" id="novo-grupo-razaosocial" style="display:none">
                        <label>Razão Social <span class="obrigatorio">*</span></label>
                        <input type="text" id="novo-razaosocial" placeholder="Razão social da empresa">
                    </div>
                    <div class="form-group" id="novo-grupo-nomefantasia" style="display:none">
                        <label>Nome Fantasia</label>
                        <input type="text" id="novo-nomefantasia" placeholder="Nome fantasia">
                    </div>
                </div>

                <!-- Contato -->
                <p class="form-secao">Contato</p>
                <div class="form-grid">
                    <div class="form-group form-col-2">
                        <label>Email <span class="obrigatorio">*</span></label>
                        <input type="email" id="novo-email" placeholder="email@exemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="novo-telefone" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <!-- Dados Comerciais -->
                <p class="form-secao">Dados Comerciais</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tipo de Cliente</label>
                        <select id="novo-tipocliente">
                            <option value="1">Padrão</option>
                            <option value="2">VIP</option>
                            <option value="3">Atacado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Saldo Devedor (R$)</label>
                        <input type="number" id="novo-saldo" placeholder="0,00" min="0" step="0.01">
                    </div>
                    <div class="form-group form-col-2">
                        <label>Observação</label>
                        <textarea id="novo-observacao" placeholder="Observações sobre o cliente..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secundario" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-primario"><i class="bi bi-check-lg"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════
     MODAL: EDIÇÃO
════════════════════════════════════════ -->
<div class="modal" id="modal-edicao">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h3><i class="bi bi-pencil-fill"></i> Editar Cliente</h3>
            <button class="btn-fechar-modal" onclick="fecharModalEdicao()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="form-edicao">

                <!-- Toggle PF / PJ -->
                <div class="tipo-selector">
                    <span class="tipo-selector-label">Tipo de pessoa:</span>
                    <button type="button" class="tipo-btn tipo-btn-ativo" data-prefixo="edit" data-tipo="PF" onclick="alternarTipo('PF','edit')">
                        <i class="bi bi-person-fill"></i> Pessoa Física
                    </button>
                    <button type="button" class="tipo-btn" data-prefixo="edit" data-tipo="PJ" onclick="alternarTipo('PJ','edit')">
                        <i class="bi bi-building"></i> Pessoa Jurídica
                    </button>
                </div>

                <!-- Identificação -->
                <p class="form-secao">Identificação</p>
                <div class="form-grid">
                    <div class="form-group form-col-2">
                        <label>Nome Completo <span class="obrigatorio">*</span></label>
                        <input type="text" id="edit-nome" required>
                    </div>
                    <div class="form-group">
                        <label id="edit-label-doc">CPF <span class="obrigatorio">*</span></label>
                        <input type="text" id="edit-doc" required>
                    </div>
                    <div class="form-group" id="edit-grupo-genero">
                        <label>Gênero</label>
                        <select id="edit-genero">
                            <option value="">Selecione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outro</option>
                        </select>
                    </div>
                    <div class="form-group" id="edit-grupo-nascimento">
                        <label>Data de Nascimento</label>
                        <input type="date" id="edit-nascimento">
                    </div>
                    <div class="form-group" id="edit-grupo-estadocivil">
                        <label>Estado Civil</label>
                        <select id="edit-estadocivil">
                            <option value="">Selecione</option>
                            <option value="Solteiro">Solteiro(a)</option>
                            <option value="Casado">Casado(a)</option>
                            <option value="Divorciado">Divorciado(a)</option>
                            <option value="Viúvo">Viúvo(a)</option>
                        </select>
                    </div>
                    <!-- PJ -->
                    <div class="form-group form-col-2" id="edit-grupo-razaosocial" style="display:none">
                        <label>Razão Social</label>
                        <input type="text" id="edit-razaosocial">
                    </div>
                    <div class="form-group" id="edit-grupo-nomefantasia" style="display:none">
                        <label>Nome Fantasia</label>
                        <input type="text" id="edit-nomefantasia">
                    </div>
                </div>

                <!-- Contato -->
                <p class="form-secao">Contato</p>
                <div class="form-grid">
                    <div class="form-group form-col-2">
                        <label>Email <span class="obrigatorio">*</span></label>
                        <input type="email" id="edit-email" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="edit-telefone">
                    </div>
                </div>

                <!-- Dados Comerciais -->
                <p class="form-secao">Dados Comerciais</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tipo de Cliente</label>
                        <select id="edit-tipocliente">
                            <option value="1">Padrão</option>
                            <option value="2">VIP</option>
                            <option value="3">Atacado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Saldo Devedor (R$)</label>
                        <input type="number" id="edit-saldo" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Data de Cadastro</label>
                        <input type="text" id="edit-cadastro" readonly>
                    </div>
                    <div class="form-group form-col-2">
                        <label>Observação</label>
                        <textarea id="edit-observacao"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secundario" onclick="fecharModalEdicao()">Cancelar</button>
                    <button type="submit" class="btn-primario"><i class="bi bi-check-lg"></i> Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════
     MODAL: CONFIRMAÇÃO
════════════════════════════════════════ -->
<div class="modal" id="modal-confirmar">
    <div class="modal-content" style="width:420px">
        <div class="modal-header">
            <h3><i class="bi bi-exclamation-triangle-fill" style="color:#ef4444"></i> Confirmação</h3>
            <button class="btn-fechar-modal" onclick="fecharModalConfirmar()">&times;</button>
        </div>
        <div class="confirm-body">
            <div class="confirm-icone">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <p id="confirm-mensagem">Deseja inativar este cliente?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secundario" onclick="fecharModalConfirmar()">Não, cancelar</button>
            <button type="button" class="btn-perigo" id="confirm-btn-sim">Sim, inativar</button>
        </div>
    </div>
</div>

<script src="/WebApplication5/wwwroot/js/menuJS/menu.js"></script>
<script src="/WebApplication5/wwwroot/js/clienteJS/cliente.js"></script>
</body>
</html>
